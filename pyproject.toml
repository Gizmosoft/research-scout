[project]
name = "research-scout"
version = "0.1.0"
description = "Local CLI that finds new research papers and blogs for a saved user profile."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "ollama>=0.4",
    "pydantic>=2",
    "pydantic-settings>=2",
    "rich>=13",
    "trafilatura>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
research-scout = "research_scout.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
